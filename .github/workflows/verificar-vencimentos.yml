name: Verificar Vencimentos Hopper

# Agendamento diario as 07:00 BRT
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - name: Acordar servidor Render
        run: |
          curl -f --retry 5 --retry-delay 10 --retry-connrefused \
            https://hopper-comercial.onrender.com/ping
          echo "Servidor acordado!"

      - name: Aguardar estabilização
        run: sleep 15

      - name: Disparar verificação de vencimentos
        run: |
          curl -f -X POST \
            -H "x-job-secret: ${{ secrets.JOB_SECRET_TOKEN }}" \
            https://hopper-comercial.onrender.com/api/jobs/verificar-vencimentos
          echo "Verificação concluída!"
